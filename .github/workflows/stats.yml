name: Generate stats card

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/stats.yml"

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate stats card
        id: stats_1
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=dracula&locale=en&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Wait before retry
        if: steps.stats_1.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Retry stats card
        id: stats_2
        if: steps.stats_1.outcome == 'failure'
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=dracula&locale=en&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Keep previous stats card
        if: always() && steps.stats_1.outcome == 'failure' && steps.stats_2.outcome == 'failure'
        shell: bash
        run: echo "::warning::GitHub stats data is temporarily unavailable. Keeping the previous stats card."

      - name: Push stats card
        if: always() && (steps.stats_1.outcome == 'success' || steps.stats_2.outcome == 'success')
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
