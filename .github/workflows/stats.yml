name: Generate arcade animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: arcade-animation-${{ github.repository }}
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate pacman contribution graph
        id: generate_1
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "pacman"

      - name: Wait before first retry
        if: steps.generate_1.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Retry pacman contribution graph
        id: generate_2
        if: steps.generate_1.outcome == 'failure'
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "pacman"

      - name: Wait before final retry
        if: steps.generate_1.outcome == 'failure' && steps.generate_2.outcome == 'failure'
        shell: bash
        run: sleep 60

      - name: Final retry pacman contribution graph
        id: generate_3
        if: steps.generate_1.outcome == 'failure' && steps.generate_2.outcome == 'failure'
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "pacman"

      - name: Keep previous pacman graph
        if: always() && steps.generate_1.outcome == 'failure' && steps.generate_2.outcome == 'failure' && steps.generate_3.outcome == 'failure'
        shell: bash
        run: echo "::warning::GitHub GraphQL is temporarily unavailable. Keeping the previous pacman-output."

      - name: Push pacman contribution graph
        if: always() && (steps.generate_1.outcome == 'success' || steps.generate_2.outcome == 'success' || steps.generate_3.outcome == 'success')
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
