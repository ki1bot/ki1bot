name: Generate languages card

on:
  schedule: # execute every 12 hours
    - cron: "47 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/languages.yml"

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Generate languages.svg
        shell: bash
        run: |
          mkdir -p dist
          python <<'PY'
          import hashlib
          import html
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import Counter

          owner = os.environ["GITHUB_OWNER"]
          github_token = os.environ.get(
              "GITHUB_TOKEN",
              "",
          ).strip()

          def make_request(url, token=None):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ki1bot-profile-languages",
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              return urllib.request.Request(
                  url,
                  headers=headers,
              )

          def api(path, params=None):
              query = ""

              if params:
                  query = "?" + urllib.parse.urlencode(
                      params
                  )

              url = (
                  f"https://api.github.com"
                  f"{path}"
                  f"{query}"
              )

              tokens = (
                  [github_token, None]
                  if github_token
                  else [None]
              )

              last_error = None

              for token in tokens:
                  try:
                      with urllib.request.urlopen(
                          make_request(url, token),
                          timeout=30,
                      ) as response:
                          payload = (
                              response
                              .read()
                              .decode("utf-8")
                          )

                          return (
                              json.loads(payload)
                              if payload
                              else None
                          )

                  except urllib.error.HTTPError as error:
                      last_error = error

                      if (
                          token
                          and error.code in (
                              401,
                              403,
                              404,
                          )
                      ):
                          continue

                      raise

              if last_error:
                  raise last_error

              raise RuntimeError(
                  "GitHub API request failed"
              )

          def load_repositories():
              repositories = []
              page = 1

              while True:
                  data = api(
                      f"/users/{urllib.parse.quote(owner)}/repos",
                      {
                          "type": "owner",
                          "sort": "updated",
                          "direction": "desc",
                          "per_page": 100,
                          "page": page,
                      },
                  )

                  if not data:
                      break

                  repositories.extend(
                      repository
                      for repository in data
                      if not repository.get(
                          "fork",
                          False,
                      )
                  )

                  if len(data) < 100:
                      break

                  page += 1

              return repositories

          colors = {
              "TypeScript": "#3178c6",
              "PHP": "#4F5D95",
              "JavaScript": "#f1e05a",
              "CSS": "#663399",
              "Shell": "#89e051",
              "Java": "#b07219",
              "Python": "#3572A5",
              "Dart": "#00B4AB",
              "Go": "#00ADD8",
              "HTML": "#e34c26",
              "Blade": "#f7523f",
              "C++": "#f34b7d",
              "C": "#555555",
              "Vue": "#41b883",
              "Kotlin": "#A97BFF",
              "Swift": "#F05138",
              "Ruby": "#701516",
              "Rust": "#dea584",
          }

          def language_color(language):
              if language in colors:
                  return colors[language]

              digest = hashlib.sha256(
                  language.encode("utf-8")
              ).hexdigest()

              hue = int(
                  digest[:4],
                  16,
              ) % 360

              return (
                  f"hsl("
                  f"{hue}, "
                  f"62%, "
                  f"55%"
                  f")"
              )

          repositories = load_repositories()

          totals = Counter()

          for repository in repositories:
              repository_name = repository["name"]

              data = api(
                  f"/repos/"
                  f"{urllib.parse.quote(owner)}/"
                  f"{urllib.parse.quote(repository_name)}/"
                  f"languages"
              )

              if not isinstance(data, dict):
                  continue

              for language, byte_count in data.items():
                  totals[language] += int(
                      byte_count
                  )

          top_languages = totals.most_common(6)

          total_bytes = sum(
              totals.values()
          )

          bar_x = 25
          bar_y = 62
          bar_width = 270

          segments = []
          items = []
          offset = 0.0

          for index, (
              language,
              byte_count,
          ) in enumerate(top_languages):
              if total_bytes:
                  percentage = (
                      byte_count
                      / total_bytes
                      * 100
                  )
              else:
                  percentage = 0.0

              width = (
                  bar_width
                  * percentage
                  / 100
              )

              color = language_color(
                  language
              )

              segments.append(
                  f'<rect '
                  f'x="{bar_x + offset:.2f}" '
                  f'y="{bar_y}" '
                  f'width="{width:.2f}" '
                  f'height="8" '
                  f'fill="{color}"/>'
              )

              column = (
                  0
                  if index < 3
                  else 1
              )

              row = (
                  index
                  if index < 3
                  else index - 3
              )

              x = 25 + column * 150
              y = 102 + row * 25

              items.append(
                  f'<circle '
                  f'cx="{x + 5}" '
                  f'cy="{y - 4}" '
                  f'r="5" '
                  f'fill="{color}"/>'
                  f'<text '
                  f'x="{x + 15}" '
                  f'y="{y}" '
                  f'class="lang">'
                  f'{html.escape(language)} '
                  f'{percentage:.2f}%'
                  f'</text>'
              )

              offset += width

          if not top_languages:
              items.append(
                  '<text '
                  'x="25" '
                  'y="110" '
                  'class="lang">'
                  'No language data available'
                  '</text>'
              )

          svg = f'''<svg width="320" height="165" viewBox="0 0 320 165" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
          <title id="titleId">Most Used Languages</title>
          <desc id="descId">Languages calculated from GitHub Linguist byte counts across all owned non-fork repositories.</desc>
          <style>
            .header {{ font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ff6e96; }}
            .lang {{ font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f8f8f2; }}
          </style>
          <rect x="0.5" y="0.5" width="319" height="164" rx="4.5" fill="#282a36" stroke="#e4e2e2" stroke-opacity="0"/>
          <text x="25" y="35" class="header">Most Used Languages</text>
          <rect x="{bar_x}" y="{bar_y}" width="{bar_width}" height="8" rx="4" fill="#44475a"/>
          <clipPath id="barClip">
            <rect x="{bar_x}" y="{bar_y}" width="{bar_width}" height="8" rx="4"/>
          </clipPath>
          <g clip-path="url(#barClip)">
            {''.join(segments)}
          </g>
          {''.join(items)}
          </svg>'''

          with open(
              "dist/languages.svg",
              "w",
              encoding="utf-8",
          ) as file:
              file.write(svg)
          PY

      - name: Push languages.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: languages-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
